root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  entrypoint = ["./tmp/api"]

  delay = 1000

  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "migrations"]
  exclude_regex = ["_test.go"]

  include_ext = ["go", "tpl", "tmpl", "html"]

  stop_on_error = true

  log = "build-errors.log"

  rerun = false

  [build.windows]
    cmd = "go build -o ./tmp/api.exe ./cmd/api"
    bin = "tmp\\api.exe"
    entrypoint = ["tmp\\api.exe"]

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true